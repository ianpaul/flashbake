[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashbake"
version = "0.30.0"
description = "Automation to feed life log into version control message stream."
readme = "README.md"
authors = [
    {name = "Thomas Gideon", email = "cmdln@thecommandline.net"},
]
license = "GPL-3.0-only"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Artistic Software",
]
dependencies = [
    "feedparser>=6.0",
    "requests>=2.28",
]

[project.scripts]
flashbake = "flashbake.console:main"
flashbakeall = "flashbake.console:multiple_projects"

[project.urls]
"Source Code" = "https://github.com/ianpaul/flashbake"

[tool.setuptools.packages.find]
where = ["src"]
