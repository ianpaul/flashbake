[tox]
envlist = py39, py311, py313

[testenv]
commands =
    # Legacy unittest suite (config, file-handling tests)
    python test/test.py
    # New pytest suite (integration, git wrapper, plugin behaviour)
    pytest test/test_integration.py test/test_git.py test/test_plugin_behavior.py -v
deps =
    pytest
    feedparser>=6.0
    requests>=2.28
